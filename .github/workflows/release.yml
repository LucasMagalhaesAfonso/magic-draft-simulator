name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or get release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: data.id,
                draft: true,
              });
              return String(data.id);
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Magic Draft ${tag}`,
              body: `## Magic Draft Simulator ${tag}\n\n### Instalação\n- **Windows**: baixe \`Magic Draft_x.x.x_x64-setup.exe\` e execute.\n- **Linux**: baixe \`magic-draft_x.x.x_amd64.AppImage\`, dê permissão (\`chmod +x\`) e execute.\n\n### Sets incluídos\n- Tarkir Dragonstorm (TDM)\n- Lord of the Rings (LTR)`,
              draft: true,
              prerelease: false,
            });
            return String(data.id);
          result-encoding: string

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch 17lands ratings
        run: npm run fetch-17lands
        continue-on-error: true

      - name: Export AI model from cloud
        run: npx tsx tools/export-ai-model.ts
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        continue-on-error: true

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_SOCKET_SERVER_URL: ${{ secrets.VITE_SOCKET_SERVER_URL }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}


  sign-and-publish:
    needs: [create-release, build]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Sign installers and upload latest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -e
          REPO="${{ github.repository }}"
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          BASE="https://github.com/${REPO}/releases/download/v${VERSION}"
          EXE_NAME="Magic.Draft_${VERSION}_x64-setup.exe"
          APPIMAGE_NAME="Magic.Draft_${VERSION}_amd64.AppImage"
          echo "Version: ${VERSION}"

          ASSETS=$(curl -sf -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets")

          EXE_URL=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith("x64-setup.exe")) | .url')
          APPIMAGE_URL=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith(".AppImage")) | .url')

          echo "Downloading EXE..."
          curl -fL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/octet-stream" "${EXE_URL}" -o installer.exe

          echo "Downloading AppImage..."
          curl -fL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/octet-stream" "${APPIMAGE_URL}" -o installer.AppImage

          echo "Signing..."
          EXE_SIG=$(npx @tauri-apps/cli signer sign -k "${TAURI_SIGNING_PRIVATE_KEY}" installer.exe)
          APPIMAGE_SIG=$(npx @tauri-apps/cli signer sign -k "${TAURI_SIGNING_PRIVATE_KEY}" installer.AppImage)
          echo "EXE sig: ${EXE_SIG:0:40}..."
          echo "AppImage sig: ${APPIMAGE_SIG:0:40}..."
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          echo "Generating latest.json..."
          jq -n \
            --arg version "$VERSION" \
            --arg date "$DATE" \
            --arg exe_url "${BASE}/${EXE_NAME}" \
            --arg exe_sig "$EXE_SIG" \
            --arg appimage_url "${BASE}/${APPIMAGE_NAME}" \
            --arg appimage_sig "$APPIMAGE_SIG" \
            '{version:$version,notes:("Magic Draft v"+$version),pub_date:$date,platforms:{"windows-x86_64":{url:$exe_url,signature:$exe_sig},"linux-x86_64":{url:$appimage_url,signature:$appimage_sig}}}' \
            > latest.json

          cat latest.json

          echo "Uploading latest.json..."
          curl -fL -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets?name=latest.json" \
            --data-binary @latest.json

          echo "Publishing release..."
          curl -fL -X PATCH \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${REPO}/releases/${RELEASE_ID}" \
            -d '{"draft":false}'

          echo "Done!"
