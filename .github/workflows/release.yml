name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or get release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: data.id,
                draft: true,
              });
              return String(data.id);
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Magic Draft ${tag}`,
              body: `## Magic Draft Simulator ${tag}\n\n### Instalação\n- **Windows**: baixe \`Magic Draft_x.x.x_x64-setup.exe\` e execute.\n- **Linux**: baixe \`magic-draft_x.x.x_amd64.AppImage\`, dê permissão (\`chmod +x\`) e execute.\n\n### Sets incluídos\n- Tarkir Dragonstorm (TDM)\n- Lord of the Rings (LTR)`,
              draft: true,
              prerelease: false,
            });
            return String(data.id);
          result-encoding: string

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch 17lands ratings
        run: npm run fetch-17lands
        continue-on-error: true

      - name: Export AI model from cloud
        run: npx tsx tools/export-ai-model.ts
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        continue-on-error: true

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_SOCKET_SERVER_URL: ${{ secrets.VITE_SOCKET_SERVER_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      # Upload .sig files as workflow artifacts so publish-release can use them
      - name: Upload sig artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: sig-linux
          path: src-tauri/target/release/bundle/**/*.sig
          if-no-files-found: warn

      - name: Upload sig artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: sig-windows
          path: src-tauri/target/release/bundle/**/*.sig
          if-no-files-found: warn

  publish-release:
    needs: [create-release, build]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download sig artifacts
        uses: actions/download-artifact@v4
        with:
          path: sigs
        continue-on-error: true

      - name: Generate and upload latest.json
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');

            const releaseId = parseInt(process.env.RELEASE_ID);
            const tag = context.ref.replace('refs/tags/', '');
            const version = tag.replace(/^v/, '');

            // Get release info
            const { data: release } = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
            });

            const baseUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/${tag}`;

            // Find installers
            const winInstaller = release.assets.find(a => a.name.endsWith('_x64-setup.exe'));
            const linuxAppImage = release.assets.find(a => a.name.endsWith('.AppImage'));

            // Try to read .sig files from downloaded artifacts
            function findSig(dir, pattern) {
              try {
                const result = execSync(`find ${dir} -name "${pattern}" 2>/dev/null`).toString().trim();
                if (result) return fs.readFileSync(result.split('\n')[0], 'utf8').trim();
              } catch {}
              return null;
            }

            // Try to read from workflow artifacts first, then from release assets
            let winSig = findSig('sigs/sig-windows', '*.exe.sig');
            let linuxSig = findSig('sigs/sig-linux', '*.AppImage.sig');

            // If no sigs found from artifacts, check if tauri-action already uploaded them to release
            if (!winSig) {
              const winSigAsset = release.assets.find(a => a.name.endsWith('.exe.sig'));
              if (winSigAsset) {
                const resp = await fetch(winSigAsset.browser_download_url);
                winSig = await resp.text();
              }
            }
            if (!linuxSig) {
              const linuxSigAsset = release.assets.find(a => a.name.endsWith('.AppImage.sig'));
              if (linuxSigAsset) {
                const resp = await fetch(linuxSigAsset.browser_download_url);
                linuxSig = await resp.text();
              }
            }

            // If still no sigs, sign using the private key
            if ((!winSig || !linuxSig) && process.env.TAURI_SIGNING_PRIVATE_KEY) {
              console.log('Signing not found in artifacts — signing locally...');
              // Write private key to temp file
              const keyContent = process.env.TAURI_SIGNING_PRIVATE_KEY;
              fs.writeFileSync('/tmp/tauri.key', keyContent);

              const signFile = async (asset, outPath) => {
                if (!asset) return null;
                console.log(`Downloading ${asset.name}...`);
                const resp = await fetch(asset.browser_download_url);
                const buf = Buffer.from(await resp.arrayBuffer());
                fs.writeFileSync(outPath, buf);
                try {
                  const pw = process.env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '';
                  execSync(
                    `npx --yes @tauri-apps/cli signer sign "${outPath}" --private-key-path /tmp/tauri.key ${pw ? `--password "${pw}"` : ''}`,
                    { stdio: 'pipe' }
                  );
                  return fs.readFileSync(`${outPath}.sig`, 'utf8').trim();
                } catch(e) {
                  console.log('Sign error:', e.message);
                  return null;
                }
              };

              if (!winSig && winInstaller)   winSig   = await signFile(winInstaller,   '/tmp/installer.exe');
              if (!linuxSig && linuxAppImage) linuxSig = await signFile(linuxAppImage, '/tmp/installer.AppImage');
            }

            if (!winSig && !linuxSig) {
              console.log('No signatures available — skipping latest.json');
              console.log('Windows installer found:', !!winInstaller);
              console.log('Linux AppImage found:', !!linuxAppImage);
              console.log('Available assets:', release.assets.map(a => a.name).join(', '));
            } else {
              const pubDate = new Date().toISOString();
              const platforms = {};
              if (winInstaller && winSig) {
                platforms['windows-x86_64'] = {
                  signature: winSig,
                  url: `${baseUrl}/${winInstaller.name}`,
                };
              }
              if (linuxAppImage && linuxSig) {
                platforms['linux-x86_64'] = {
                  signature: linuxSig,
                  url: `${baseUrl}/${linuxAppImage.name}`,
                };
              }

              const latestJson = JSON.stringify({ version, notes: `Magic Draft ${tag}`, pub_date: pubDate, platforms }, null, 2);
              console.log('Generated latest.json:', latestJson);
              fs.writeFileSync('/tmp/latest.json', latestJson);

              // Delete existing latest.json if present
              const existing = release.assets.find(a => a.name === 'latest.json');
              if (existing) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: existing.id,
                });
              }

              // Upload latest.json
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
                name: 'latest.json',
                data: fs.readFileSync('/tmp/latest.json'),
              });
              console.log('latest.json uploaded successfully!');
            }

      - name: Publish release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: parseInt(process.env.RELEASE_ID),
              draft: false,
            });
